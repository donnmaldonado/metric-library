metrics:
  - name: mtbf
    label: MTBF
    description: Mean Time Between Failures — average operating time between unplanned stoppages.
    type: derived
    type_params:
      expr: available_minutes / 60.0 / nullif(failure_count, 0)
      metrics:
        - name: available_minutes
        - name: failure_count
    config:
      meta:
        metricId: mtbf
        tier: kpi
        domain: engineering
        industry: cross_industry
