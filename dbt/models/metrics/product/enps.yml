metrics:
  - name: enps
    label: eNPS
    description: Employee net promoter score — likelihood to recommend the company as a workplace
    type: derived
    type_params:
      expr: (promoters - detractors) * 100.0 / responses
      metrics:
        - name: enps_promoters
          alias: promoters
        - name: enps_detractors
          alias: detractors
        - name: enps_responses
          alias: responses
    config:
      meta:
        metricId: enps
        tier: kpi
        vertical: product
        industry: cross_industry
