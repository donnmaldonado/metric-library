metrics:
  - name: mau
    label: MAU
    description: Monthly Active Users — unique users active in the last 30 days.
    type: cumulative
    type_params:
      measure: user_events_distinct_user_count
      cumulative_type_params:
        window: 30 days
    filter: "{{ Dimension('user_event__is_active_event') }}"
    config:
      meta:
        metricId: mau
        tier: kpi
        domain: product
        industry: cross_industry
