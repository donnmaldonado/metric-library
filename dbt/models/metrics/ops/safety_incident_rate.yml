metrics:
  - name: safety_incident_rate
    label: Safety Incident Rate
    description: OSHA recordable incident rate per 100 full-time employees.
    type: derived
    type_params:
      expr: recordable_incidents * 200000 / total_hours_worked
      metrics:
        - name: recordable_incidents
        - name: total_hours_worked
    config:
      meta:
        metricId: safety_incident_rate
        tier: kpi
        vertical: ops
        industry: manufacturing
