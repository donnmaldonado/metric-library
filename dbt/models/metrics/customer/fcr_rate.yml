metrics:
  - name: fcr_rate
    label: First Contact Resolution Rate
    description: Percentage of support cases resolved on the first contact.
    type: ratio
    type_params:
      numerator: first_contact_resolutions
      denominator: tickets_created
    config:
      meta:
        metricId: fcr_rate
        tier: kpi
        domain: customer
        industry: cross_industry
        shortLabel: FCR %
        unit: rate
