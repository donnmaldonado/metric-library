metrics:
  - name: ticket_backlog
    label: Ticket Backlog
    description: Open tickets that have been unresolved beyond standard SLA
    type: simple
    type_params:
      measure: ticket_count
    filter: "{{ Dimension('ticket__status') }} = 'open' AND {{ Dimension('ticket__is_sla_breached') }} = true"
    config:
      meta:
        metricId: ticket_backlog
        tier: kpi
        domain: customer
        industry: cross_industry
