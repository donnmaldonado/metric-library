metrics:
  - name: preventive_maintenance_rate
    label: Preventive Maintenance Rate
    description: '% of maintenance activity that is planned preventive vs reactive.'
    type: ratio
    type_params:
      numerator:
        name: work_orders
        filter: "{{ Dimension('work_order__maintenance_type') }} = 'preventive'"
      denominator: work_orders
    config:
      meta:
        metricId: preventive_maintenance_rate
        tier: kpi
        domain: operations
        industry: cross_industry
