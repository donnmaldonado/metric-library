metrics:
  - name: rev_from_new_customers
    label: New Customer Revenue
    description: Revenue from customers acquired in the period
    type: simple
    type_params:
      measure: revenue_amount
    filter: "{{ Dimension('revenue_event__customer_age_days') }} <= 90"
    config:
      meta:
        metricId: rev_from_new_customers
        tier: kpi
        vertical: finance
        industry: financial_services
