metrics:
  - name: net_debt
    label: Net Debt
    description: Total debt minus cash and equivalents
    type: derived
    type_params:
      expr: total_debt - cash_and_equivalents
      metrics:
        - name: total_debt
        - name: cash_and_equivalents
    config:
      meta:
        metricId: net_debt
        tier: kpi
        vertical: finance
        industry: financial_services
