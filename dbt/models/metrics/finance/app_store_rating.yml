metrics:
  - name: app_store_rating
    label: App Store Rating
    description: Average rating on iOS App Store and Google Play
    type: simple
    type_params:
      measure: avg_rating_score
    filter: "{{ Dimension('review__review_source') }} = 'app_store'"
    config:
      meta:
        metricId: app_store_rating
        tier: kpi
        vertical: finance
        industry: cross_industry
