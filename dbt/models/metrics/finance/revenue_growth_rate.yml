metrics:
  - name: revenue_growth_rate
    label: Revenue Growth Rate
    description: YoY or QoQ revenue growth percentage.
    type: derived
    type_params:
      expr: (revenue - revenue_prior_period) / nullif(revenue_prior_period, 0)
      metrics:
        - name: revenue
        - name: revenue
          offset_window: 1 month
          alias: revenue_prior_period
    config:
      meta:
        metricId: revenue_growth_rate
        tier: kpi
        domain: finance
        industry: cross_industry
