metrics:
  - name: app_downloads
    label: App Downloads
    description: Total app installs from app stores in the period
    type: simple
    type_params:
      measure: app_store_event_count
    filter: "{{ Dimension('app_store_event__event_type') }} = 'download'"
    config:
      meta:
        metricId: app_downloads
        tier: input
        vertical: finance
        industry: cross_industry
