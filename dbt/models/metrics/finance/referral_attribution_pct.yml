metrics:
  - name: referral_attribution_pct
    label: Referral Attribution %
    description: Percentage of closed revenue attributed to referral channels
    type: ratio
    type_params:
      numerator:
        name: total_pipeline
        filter: "{{ Dimension('opportunity__channel') }} = 'referral'"
      denominator: total_pipeline
    config:
      meta:
        metricId: referral_attribution_pct
        tier: kpi
        vertical: finance
        industry: cross_industry
