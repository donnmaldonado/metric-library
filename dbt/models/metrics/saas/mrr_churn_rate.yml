metrics:
  - name: mrr_churn_rate
    label: MRR Churn %
    description: Percentage of MRR lost in the period from cancellations
    type: derived
    type_params:
      expr: churned_arr / nullif(starting_arr, 0)
      metrics:
        - name: churned_arr
        - name: starting_arr
    config:
      meta:
        metricId: mrr_churn_rate
        tier: kpi
        domain: saas
        industry: saas
