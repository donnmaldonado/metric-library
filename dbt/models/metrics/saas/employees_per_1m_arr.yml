metrics:
  - name: employees_per_1m_arr
    label: Employees per Million ARR
    description: Operational efficiency — fewer employees per $1M ARR indicates more scalable business.
    type: derived
    type_params:
      expr: headcount / nullif(arr / 1000000, 0)
      metrics:
        - name: headcount
        - name: arr
    config:
      meta:
        metricId: employees_per_1m_arr
        tier: kpi
        domain: saas
        industry: saas
        shortLabel: Employees / $1M ARR
        unit: ratio
