metrics:
  - name: arr
    label: ARR
    description: Annual Recurring Revenue — annualized value of active subscriptions.
    type: simple
    type_params:
      measure: subscriptions_arr_value
    filter: "{{ Dimension('subscription_snapshot__status') }} = 'active'"
    config:
      meta:
        metricId: arr
        tier: kpi
        domain: saas
        industry: saas
        shortLabel: ARR
        unit: currency
