metrics:
  - name: contracted_unbilled
    label: Contracted Unbilled ARR
    description: ARR under contract not yet invoiced.
    type: simple
    type_params:
      measure: unbilled_contract_arr
    filter: "{{ Dimension('contract__status') }} = 'active'"
    config:
      meta:
        metricId: contracted_unbilled
        tier: input
        domain: saas
        industry: cross_industry
        shortLabel: Contracted Unbilled
        unit: currency
