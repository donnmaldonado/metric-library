metrics:
  - name: magic_number
    label: SaaS Magic Number
    description: Net new ARR divided by prior quarter S&M spend — go-to-market efficiency.
    type: derived
    type_params:
      expr: net_new_arr / nullif(sm_spend_prior_quarter, 0)
      metrics:
        - name: net_new_arr
        - name: sm_spend
          offset_window: 1 quarter
          alias: sm_spend_prior_quarter
    config:
      meta:
        metricId: magic_number
        tier: kpi
        domain: saas
        industry: cross_industry
        shortLabel: Magic Number
        unit: ratio
