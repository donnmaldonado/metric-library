metrics:
  - name: customer_count
    label: Active Customers
    description: Total number of active paying customers.
    type: simple
    type_params:
      measure: active_customer_count
    filter: "{{ Dimension('subscription_snapshot__status') }} = 'active'"
    config:
      meta:
        metricId: customer_count
        tier: input
        domain: saas
        industry: cross_industry
        shortLabel: Customer Count
        unit: count
