metrics:
  - name: arr_growth_rate
    label: ARR Growth %
    description: Year-over-year growth in annual recurring revenue
    type: derived
    type_params:
      expr: (arr - arr_prior_year) / nullif(arr_prior_year, 0)
      metrics:
        - name: arr
        - name: arr
          offset_window: 1 year
          alias: arr_prior_year
    config:
      meta:
        metricId: arr_growth_rate
        tier: kpi
        domain: saas
        industry: saas
