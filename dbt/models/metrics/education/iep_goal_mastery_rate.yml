metrics:
  - name: iep_goal_mastery_rate
    label: IEP Goal Mastery Rate
    description: '% of IEP goals marked as mastered by end of evaluation period.'
    type: ratio
    type_params:
      numerator:
        name: total_goals
        filter: "{{ Dimension('iep_goal__is_mastered') }} = true"
      denominator: total_goals
    config:
      meta:
        metricId: iep_goal_mastery_rate
        tier: kpi
        domain: education
        industry: education
