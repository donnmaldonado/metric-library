metrics:
  - name: extracurricular_rate
    label: Extracurricular Participation Rate
    description: Percentage of students participating in at least one extracurricular activity.
    type: ratio
    type_params:
      numerator:
        name: enrollment_count
        filter: "{{ Dimension('enrollment__in_extracurricular') }} = true"
      denominator: enrollment_count
    config:
      meta:
        metricId: extracurricular_rate
        tier: input
        domain: education
        industry: cross_industry
        shortLabel: Extracurricular %
        unit: rate
