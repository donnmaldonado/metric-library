metrics:
  - name: ell_pct
    label: ELL Student Share
    description: Percentage of enrolled students classified as English Language Learners.
    type: ratio
    type_params:
      numerator:
        name: enrollment_count
        filter: "{{ Dimension('enrollment__is_ell') }} = true"
      denominator: enrollment_count
    config:
      meta:
        metricId: ell_pct
        tier: input
        domain: education
        industry: education
        shortLabel: ELL Students %
        unit: rate
