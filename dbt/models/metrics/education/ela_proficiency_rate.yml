metrics:
  - name: ela_proficiency_rate
    label: English Language Arts Proficiency Rate
    description: Percentage of students scoring proficient or advanced on ELA state assessments.
    type: ratio
    type_params:
      numerator:
        name: students_tested
        filter: "{{ Dimension('assessment_result__met_standard') }} = true"
      denominator: students_tested
    filter: "{{ Dimension('assessment_result__subject') }} = 'ela'"
    config:
      meta:
        metricId: ela_proficiency_rate
        tier: kpi
        domain: education
        industry: education
        shortLabel: ELA Proficiency %
        unit: rate
