metrics:
  - name: avg_teacher_experience
    label: Average Teacher Experience
    description: Average years of teaching experience across the teaching staff.
    type: simple
    type_params:
      measure: avg_years_of_experience
    filter: "{{ Dimension('staff_member__role') }} = 'teacher' AND {{ Dimension('staff_member__status') }} = 'active'"
    config:
      meta:
        metricId: avg_teacher_experience
        tier: input
        domain: education
        industry: education
        shortLabel: Avg Teacher Exp
        unit: years
