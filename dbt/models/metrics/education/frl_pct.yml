metrics:
  - name: frl_pct
    label: FRL %
    description: Percentage of students eligible for free or reduced-price lunch (socioeconomic indicator)
    type: ratio
    type_params:
      numerator:
        name: enrollment_count
        filter: "{{ Dimension('enrollment__is_frl_eligible') }} = true"
      denominator: enrollment_count
    config:
      meta:
        metricId: frl_pct
        tier: input
        domain: education
        industry: education
