metrics:
  - name: adm
    label: Average Daily Membership
    description: Average number of students enrolled per day (used for funding calculations).
    type: derived
    type_params:
      expr: days_enrolled / school_days
      metrics:
        - name: days_enrolled
        - name: school_days
    config:
      meta:
        metricId: adm
        tier: input
        domain: education
        industry: education
        shortLabel: ADM
        unit: count
