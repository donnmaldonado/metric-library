metrics:
  - name: math_proficiency_rate
    label: Math Proficiency Rate
    description: Percentage of students scoring proficient or advanced on math state assessments.
    type: ratio
    type_params:
      numerator:
        name: students_tested
        filter: "{{ Dimension('assessment_result__met_standard') }} = true"
      denominator: students_tested
    filter: "{{ Dimension('assessment_result__subject') }} = 'math'"
    config:
      meta:
        metricId: math_proficiency_rate
        tier: kpi
        domain: education
        industry: education
        shortLabel: Math Proficiency %
        unit: rate
