metrics:
  - name: college_enrollment_rate
    label: College Enrollment %
    description: Percentage of graduates enrolled in a 2- or 4-year college within 16 months
    type: ratio
    type_params:
      numerator:
        name: total_graduates
        filter: "{{ Dimension('student_cohort_outcome__enrolled_college_within_16_months') }} = true"
      denominator: total_graduates
    config:
      meta:
        metricId: college_enrollment_rate
        tier: north_star
        domain: education
        industry: cross_industry
