metrics:
  - name: four_year_grad_rate
    label: Four-Year Graduation Rate
    description: Percentage of students graduating within 4 years of entering 9th grade.
    type: ratio
    type_params:
      numerator:
        name: adjusted_cohort_students
        filter: "{{ Dimension('student_cohort_outcome__graduated_in_4_years') }} = true"
      denominator: adjusted_cohort_students
    config:
      meta:
        metricId: four_year_grad_rate
        tier: north_star
        domain: education
        industry: cross_industry
        shortLabel: 4-Year Grad Rate
        unit: rate
