metrics:
  - name: on_time_lesson_delivery
    label: On-Time Lesson Delivery Rate
    description: '% of planned lessons delivered on schedule per teacher or classroom.'
    type: ratio
    type_params:
      numerator:
        name: planned_lessons
        filter: "{{ Dimension('lesson__delivered_on_time') }} = true"
      denominator: planned_lessons
    config:
      meta:
        metricId: on_time_lesson_delivery
        tier: input
        domain: education
        industry: cross_industry
        shortLabel: On-Time Lessons %
        unit: rate
