metrics:
  - name: course_completion_rate
    label: Course Completion %
    description: Percentage of enrolled students who successfully completed a course
    type: ratio
    type_params:
      numerator:
        name: enrolled_courses
        filter: "{{ Dimension('course_enrollment__is_completed') }} = true"
      denominator: enrolled_courses
    config:
      meta:
        metricId: course_completion_rate
        tier: kpi
        domain: education
        industry: cross_industry
