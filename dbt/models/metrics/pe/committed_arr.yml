metrics:
  - name: committed_arr
    label: Committed ARR
    description: ARR under signed contracts not yet recognized
    type: simple
    type_params:
      measure: contract_arr
    filter: "{{ Dimension('contract__status') }} = 'signed_not_started'"
    config:
      meta:
        metricId: committed_arr
        tier: input
        vertical: pe
        industry: saas
