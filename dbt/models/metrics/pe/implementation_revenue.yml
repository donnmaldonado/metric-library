metrics:
  - name: implementation_revenue
    label: Implementation Revenue
    description: One-time revenue from customer onboarding and implementation
    type: simple
    type_params:
      measure: revenue_amount
    filter: "{{ Dimension('revenue_event__revenue_type') }} = 'implementation'"
    config:
      meta:
        metricId: implementation_revenue
        tier: input
        vertical: pe
        industry: saas
