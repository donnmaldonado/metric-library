metrics:
  - name: demo_requests
    label: Demo Requests
    description: Product demo requests submitted in the period
    type: simple
    type_params:
      measure: lead_count
    filter: "{{ Dimension('lead__lead_source') }} = 'demo_request'"
    config:
      meta:
        metricId: demo_requests
        tier: input
        domain: sales
        industry: cross_industry
