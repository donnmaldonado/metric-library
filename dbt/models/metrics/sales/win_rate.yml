metrics:
  - name: win_rate
    label: Win Rate
    description: '% of qualified opportunities that close as won.'
    type: ratio
    type_params:
      numerator: closed_won_deals
      denominator: closed_deals
    filter: "{{ Dimension('opportunity__is_qualified') }} = true"
    config:
      meta:
        metricId: win_rate
        tier: kpi
        domain: sales
        industry: cross_industry
