metrics:
  - name: email_click_rate
    label: Email Click Rate
    description: '% of delivered emails that received at least one click.'
    type: ratio
    type_params:
      numerator: emails_clicked
      denominator: emails_delivered
    config:
      meta:
        metricId: email_click_rate
        tier: kpi
        domain: marketing
        industry: cross_industry
