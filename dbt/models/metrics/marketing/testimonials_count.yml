metrics:
  - name: testimonials_count
    label: Customer Testimonials
    description: Number of customer testimonials or case studies collected YTD.
    type: simple
    type_params:
      measure: review_count
    filter: "{{ Dimension('review__review_source') }} = 'testimonial'"
    config:
      meta:
        metricId: testimonials_count
        tier: input
        domain: marketing
        industry: cross_industry
        shortLabel: Testimonials
        unit: count
