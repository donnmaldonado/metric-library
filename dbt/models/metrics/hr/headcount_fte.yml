metrics:
  - name: headcount_fte
    label: Headcount FTE
    description: Full-time equivalent employee count at end of period.
    type: simple
    type_params:
      measure: fte_fraction
    filter: "{{ Dimension('employee_snapshot__status') }} = 'active'"
    config:
      meta:
        metricId: headcount_fte
        tier: input
        domain: hr
        industry: cross_industry
