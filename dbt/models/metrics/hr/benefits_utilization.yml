metrics:
  - name: benefits_utilization
    label: Benefits Utilization Rate
    description: Percentage of eligible employees actively using offered benefits.
    type: ratio
    type_params:
      numerator:
        name: eligible_employees
        filter: "{{ Dimension('benefits_enrollment__is_active_user') }} = true"
      denominator: eligible_employees
    config:
      meta:
        metricId: benefits_utilization
        tier: input
        domain: hr
        industry: cross_industry
        shortLabel: Benefits Utilization %
        unit: rate
