metrics:
  - name: diversity_hire_rate
    label: Diversity Hire Rate
    description: Percentage of hires from underrepresented groups.
    type: ratio
    type_params:
      numerator:
        name: total_hires
        filter: "{{ Dimension('hire__is_underrepresented') }} = true"
      denominator: total_hires
    config:
      meta:
        metricId: diversity_hire_rate
        tier: kpi
        domain: hr
        industry: cross_industry
        shortLabel: Diversity Hire %
        unit: rate
