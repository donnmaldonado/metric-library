metrics:
  - name: regrettable_attrition
    label: Regrettable Attrition Share
    description: Percentage of turnover classified as regrettable by management.
    type: ratio
    type_params:
      numerator:
        name: separations
        filter: "{{ Dimension('separation__is_regrettable') }} = true"
      denominator: separations
    config:
      meta:
        metricId: regrettable_attrition
        tier: kpi
        domain: hr
        industry: cross_industry
        shortLabel: Regrettable Attrition %
        unit: rate
