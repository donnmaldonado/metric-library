metrics:
  - name: turnover_rate
    label: Employee Turnover Rate
    description: Percentage of employees who left during the period (voluntary + involuntary).
    type: derived
    type_params:
      expr: separations / avg_headcount
      metrics:
        - name: separations
        - name: avg_headcount
    config:
      meta:
        metricId: turnover_rate
        tier: north_star
        domain: hr
        industry: cross_industry
        shortLabel: Turnover %
        unit: rate
