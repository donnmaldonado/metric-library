metrics:
  - name: customer_ltv
    label: Realized Customer Lifetime Value
    description: Realized average revenue per customer to date (lifetime order revenue / customers who have ordered).
    type: derived
    type_params:
      expr: lifetime_order_revenue / lifetime_ordering_customers
      metrics:
        - name: lifetime_order_revenue
        - name: lifetime_ordering_customers
    config:
      meta:
        metricId: customer_ltv
        tier: north_star
        domain: commerce
        industry: cross_industry
        shortLabel: Realized Customer LTV
        unit: currency
