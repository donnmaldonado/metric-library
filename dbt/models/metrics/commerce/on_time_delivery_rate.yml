metrics:
  - name: on_time_delivery_rate
    label: On-Time Delivery Rate
    description: Percentage of orders or deliverables completed by the committed date
    type: ratio
    type_params:
      numerator:
        name: delivered_shipments
        filter: "{{ Dimension('shipment__is_on_time') }} = true"
      denominator: delivered_shipments
    config:
      meta:
        metricId: on_time_delivery_rate
        tier: north_star
        domain: commerce
        industry: cross_industry
