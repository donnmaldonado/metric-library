# Metrics on this model: defect_rate, stg_quality_inspection_row
models:
  - name: fct_quality_inspections
    description: One row per quality inspection.
semantic_models:
  - name: fct_quality_inspections
    description: One row per quality inspection.
    model: ref('fct_quality_inspections')
    defaults:
      agg_time_dimension: inspection_date
    entities:
      - name: inspection
        type: primary
        expr: inspection_id
      - name: product
        type: foreign
        expr: product_id
      - name: supplier
        type: foreign
        expr: supplier_id
    dimensions:
      - name: inspection_date
        type: time
        type_params:
          time_granularity: day
      - name: production_line
        type: categorical
      - name: result
        type: categorical
    measures:
      - name: inspection_count
        agg: count
        expr: inspection_id
        description: 'Used by: stg_quality_inspection_row.'
      - name: defective_units
        agg: sum
        description: 'Used by: defect_rate.'
      - name: units_inspected
        agg: sum
        description: 'Used by: defect_rate.'
metrics:
  - name: defective_units
    label: defective_units
    description: Helper input for defect_rate.
    type: simple
    type_params:
      measure: defective_units
  - name: units_inspected
    label: units_inspected
    description: Helper input for defect_rate.
    type: simple
    type_params:
      measure: units_inspected
