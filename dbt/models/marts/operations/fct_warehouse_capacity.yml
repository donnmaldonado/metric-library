# Metrics on this model: warehouse_utilization
# Columns occupied_locations and total_locations are unused; no measure uses them.
models:
  - name: fct_warehouse_capacity
    description: One row per warehouse zone and snapshot date with occupied and total capacity.
semantic_models:
  - name: fct_warehouse_capacity
    description: One row per warehouse zone and snapshot date with occupied and total capacity.
    model: ref('fct_warehouse_capacity')
    defaults:
      agg_time_dimension: snapshot_date
    entities:
      - name: warehouse_snapshot
        type: primary
        expr: warehouse_snapshot_id
      - name: facility
        type: foreign
        expr: facility_id
      - name: warehouse
        type: foreign
        expr: warehouse_id
    dimensions:
      - name: snapshot_date
        type: time
        type_params:
          time_granularity: day
      - name: product_zone
        type: categorical
    measures:
      - name: occupied_sqft
        agg: sum
        non_additive_dimension:
          name: snapshot_date
          window_choice: max
        description: 'Used by: warehouse_utilization.'
      - name: total_sqft
        agg: sum
        non_additive_dimension:
          name: snapshot_date
          window_choice: max
        description: 'Used by: warehouse_utilization.'
metrics:
  - name: occupied_sqft
    label: occupied_sqft
    description: Helper input for warehouse_utilization.
    type: simple
    type_params:
      measure: occupied_sqft
  - name: total_sqft
    label: total_sqft
    description: Helper input for warehouse_utilization.
    type: simple
    type_params:
      measure: total_sqft
