# Metrics on this model: cac, cac_payback, clv, ltv_cac
# Only additive parts are measures; averages (lifespan, MRR per new customer) are built as ratios of them.
models:
  - name: fct_unit_economics
    description: One row per channel, segment and period with acquisition spend, LTV and payback inputs.
semantic_models:
  - name: fct_unit_economics
    description: One row per channel, segment and period with acquisition spend, LTV and payback inputs.
    model: ref('fct_unit_economics')
    defaults:
      agg_time_dimension: period_start
    entities:
      - name: unit_economics_period
        type: primary
        expr: unit_economics_period_id
    dimensions:
      - name: period_start
        type: time
        type_params:
          time_granularity: day
      - name: segment
        type: categorical
      - name: cohort
        type: categorical
      - name: channel
        type: categorical
    measures:
      - name: total_acquisition_spend
        agg: sum
        description: 'Sales and marketing spend attributed to acquisition. Used by: cac.'
      - name: new_customers
        agg: sum
        description: 'Customers acquired in the period. Used by: cac, cac_payback.'
      - name: new_customer_mrr
        agg: sum
        description: 'Starting MRR of the customers acquired in the period. Used by: cac_payback.'
      - name: unit_economics_churned_customers
        agg: sum
        expr: churned_customers
        description: 'Customers lost in the period. Used by: avg_lifespan_years.'
      - name: churned_customer_lifetime_years
        agg: sum
        description: 'Total tenure (years) of the customers lost in the period. Used by: avg_lifespan_years.'
metrics:
  - name: total_acquisition_spend
    label: total_acquisition_spend
    description: Helper input for cac.
    type: simple
    type_params:
      measure: total_acquisition_spend
  - name: new_customers
    label: new_customers
    description: Helper input for cac, cac_payback.
    type: simple
    type_params:
      measure: new_customers
  - name: new_customer_mrr
    label: new_customer_mrr
    description: Helper input for cac_payback.
    type: simple
    type_params:
      measure: new_customer_mrr
  - name: unit_economics_churned_customers
    label: unit_economics_churned_customers
    description: Helper input for avg_lifespan_years.
    type: simple
    type_params:
      measure: unit_economics_churned_customers
  - name: churned_customer_lifetime_years
    label: churned_customer_lifetime_years
    description: Helper input for avg_lifespan_years.
    type: simple
    type_params:
      measure: churned_customer_lifetime_years
  - name: avg_lifespan_years
    label: avg_lifespan_years
    description: Helper input for clv. Average tenure in years of customers who churned in the period.
    type: ratio
    type_params:
      numerator: churned_customer_lifetime_years
      denominator: unit_economics_churned_customers
