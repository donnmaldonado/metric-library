# Metrics on this model: ar_aging_90d, billings, dso
models:
  - name: fct_invoices
    description: One row per customer invoice (billings and accounts receivable).
semantic_models:
  - name: fct_invoices
    description: One row per customer invoice (billings and accounts receivable).
    model: ref('fct_invoices')
    defaults:
      agg_time_dimension: invoice_date
    entities:
      - name: invoice
        type: primary
        expr: invoice_id
      - name: company
        type: foreign
        expr: company_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: invoice_date
        type: time
        type_params:
          time_granularity: day
      - name: due_date
        type: time
        type_params:
          time_granularity: day
      - name: segment
        type: categorical
      - name: days_outstanding
        type: categorical
      - name: product_tier
        type: categorical
      - name: status
        type: categorical
    measures:
      - name: invoice_amount
        agg: sum
        description: 'Used by: ar_aging_90d, billings.'
      - name: invoice_count
        agg: count
        expr: invoice_id
        description: 'Not used by any metric.'
