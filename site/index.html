<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metric Periodic Table</title>
    <meta name="description" content="Every business metric in the library as an element tile: one table per domain, North Stars first, colour for the unit. Click any tile for its formula, SQL, sources and driver edges." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23d9a255' stroke-width='1.5'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='12' text-anchor='middle' fill='%23e6e3dc'%3EMt%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#table">Skip to the table</a>
    <header class="site-header">
      <div class="header-top">
        <div class="titles">
          <h1>Metric Periodic Table</h1>
          <p id="lead" class="lead">Business metrics, each defined, tiered and wired into a driver tree</p>
        </div>
      </div>
      <div id="tabs-slot"></div>
      <div class="controls">
        <div id="search-slot"></div>
        <div id="legend-slot"></div>
      </div>
    </header>

    <div id="layout" class="layout">
      <main id="table" class="table-wrap" tabindex="-1" aria-busy="true">
        <p class="loading">Loading the table…</p>
      </main>
    </div>
    <div id="scrim" class="scrim" aria-hidden="true"></div>

    <footer class="site-footer">
      <a id="repo-link" href="https://github.com/donnmaldonado/metric-library">Source on GitHub</a>
      <span aria-hidden="true">·</span>
      <a id="portfolio-link" href="https://donnmaldonado.github.io/">Portfolio</a>
      <span aria-hidden="true">·</span>
      <span id="build"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
